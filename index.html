<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المندوب</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; }
        .product { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        .product-header { display: flex; justify-content: space-between; font-weight: bold; }
        .variant { display: flex; justify-content: space-between; padding: 5px; border-top: 1px solid #eee; }
        input[type="text"], input[type="number"] { width: 95%; padding: 8px; margin-bottom: 10px; }
        button { background-color: #007bff; color: white; padding: 10px; border: none; cursor: pointer; }

        /* أضف هذه الستايلات الجديدة */
.product-card {
    border: 1px solid #ccc;
    padding: 16px;
    margin-bottom: 15px;
    border-radius: 8px;
    background: #f9f9f9;
    /* أضف هذا التعديل للتحكم بعرض البطاقة على الموبايل والديسكتوب */
    width: 100%; /* تأخذ كل العرض المتاح */
    max-width: 350px; /* لكن لا تتجاوز 350 بكسل على الشاشات الكبيرة */
    margin-left: auto; /* لتوسيط البطاقة إذا كانت أصغر من الشاشة */
    margin-right: auto;
}
.product-card-header {
    font-weight: bold;
    font-size: 1.2em;
    margin-bottom: 10px;
}
.size-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 10px; /* مسافة بين الأزرار */
    margin-bottom: 15px;
}
.size-btn {
    padding: 8px 15px;
    border: 1px solid #ccc;
    background: #000000;
    cursor: pointer;
    border-radius: 5px;
    font-size: 0.9em;
}
.size-btn:disabled {
    background: #f0f0f0;
    color: #aaa;
    cursor: not-allowed;
    text-decoration: line-through;
}
/* هذا الـ class سيتم إضافته بالجافاسكربت عند اختيار القياس */
.size-btn.selected {
    background-color: #007bff;
    color: white;
    border-color: #007bff;
    font-weight: bold;
}
.add-main-btn {
    width: 100%;
    padding: 12px;
    font-size: 1em;
}
.product-image {
    width: 100%; /* تجعل الصورة تملأ البطاقة بالعرض */
    height: 250px; /* يمكنك تغيير الارتفاع */
    object-fit: cover; /* يضمن ظهور الصورة بشكل جيد دون تشويه */
    border-radius: 5px; /* زوايا دائرية */
    margin-bottom: 10px; /* مسافة أسفل الصورة */
}
#search-bar {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px; /* مسافة قبل قائمة المخزون */
    font-size: 1em;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box; /* ليحافظ على العرض 100% */
}
    </style>
</head>
<body>

    <div class="container">
        <h1>نظام تسجيل الطلبات</h1>

        <h2>المخزون المتوفر</h2>
        <input type="text" id="search-bar" placeholder="ابحث بالرقم أو اسم المادة...">
        <div id="inventory-list">
            </div>

        <hr>

        <h2>تسجيل طلب جديد</h2>
        <form id="order-form">
            <h3>معلومات الزبون</h3>
            <input type="text" id="customer-name" placeholder="اسم الزبون" required>
            <input type="text" id="customer-phone" placeholder="رقم الهاتف" required>
            <input type="text" id="customer-address" placeholder="العنوان" required>

            <h3>الطلبات (السلة)</h3>
            <div id="cart">
                </div>
            
            <button type="submit">تثبيت الطلب</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>
</body>
</html>
